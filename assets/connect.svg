<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title"><title id="title">Connect — Prince Patel</title><defs><linearGradient id="bg"><stop stop-color="#0B1224"/><stop offset="1" stop-color="#172C4C"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif} .float{animation:float 5s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .pulse{animation:pulse 3s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} @media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="1" y="1" width="1198" height="178" rx="24" fill="url(#bg)" stroke="#30496F"/><text x="45" y="53" font-size="15" fill="#60A5FA" font-weight="700">04 / LET’S CONNECT</text><text x="45" y="112" font-size="39" fill="#F1F5FF" font-weight="700">Have an idea? Let’s build it.</text><text x="45" y="150" font-size="18" fill="#ABB9D1" font-weight="400">Internships · Hackathons · Open-source collaboration</text><text x="1040" y="113" font-size="65" fill="#60A5FA" font-weight="400">↗</text></svg>