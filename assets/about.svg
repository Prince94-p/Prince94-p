<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title"><title id="title">About — Prince Patel</title><defs><linearGradient id="bg"><stop stop-color="#0B1224"/><stop offset="1" stop-color="#172C4C"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif} .float{animation:float 5s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .pulse{animation:pulse 3s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} @media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="1" y="1" width="1198" height="308" rx="24" fill="url(#bg)" stroke="#30496F"/><text x="45" y="55" font-size="15" fill="#60A5FA" font-weight="700">01 / BEHIND THE CODE</text><text x="45" y="106" font-size="34" fill="#F1F5FF" font-weight="700">A student. A builder.</text><text x="45" y="150" font-size="19" fill="#ABB9D1" font-weight="400">I enjoy turning ideas into useful web experiences.</text><text x="45" y="186" font-size="19" fill="#ABB9D1" font-weight="400">My focus: responsive interfaces, full-stack projects</text><text x="45" y="218" font-size="19" fill="#ABB9D1" font-weight="400">and experimenting with AI-assisted development.</text><text x="45" y="264" font-size="14" fill="#60A5FA" font-weight="700">OPEN TO INTERNSHIPS &amp; HACKATHON COLLABORATIONS</text><path d="M735 45V265" stroke="#30496F"/><text x="780" y="80" font-size="15" fill="#60A5FA" font-weight="700">HOW I WORK</text><text x="780" y="128" font-size="24" fill="#F1F5FF" font-weight="600">Build something real.</text><text x="780" y="172" font-size="24" fill="#F1F5FF" font-weight="600">Learn from the process.</text><text x="780" y="216" font-size="24" fill="#F1F5FF" font-weight="600">Improve. Repeat.</text></svg>