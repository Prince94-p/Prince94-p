<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title"><title id="title">Hero — Prince Patel</title><defs><linearGradient id="bg"><stop stop-color="#0B1224"/><stop offset="1" stop-color="#172C4C"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif} .float{animation:float 5s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .pulse{animation:pulse 3s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} @media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="1" y="1" width="1198" height="348" rx="24" fill="url(#bg)" stroke="#30496F"/><text x="50" y="57" font-size="15" fill="#60A5FA" font-weight="700">PRINCE94-P / DEVELOPER PROFILE</text><text x="50" y="137" font-size="56" fill="#F1F5FF" font-weight="700">Hi, I&#x27;m Prince Patel.</text><text x="50" y="189" font-size="26" fill="#60A5FA" font-weight="400">Frontend Developer · AI &amp; IoT Enthusiast</text><text x="50" y="241" font-size="20" fill="#ABB9D1" font-weight="400">Computer Engineering student at CSPIT, CHARUSAT.</text><text x="50" y="276" font-size="20" fill="#ABB9D1" font-weight="400">Learning by building real-world projects.</text><g class="float"><rect x="846" y="68" width="300" height="213" rx="16" fill="#0B1224" stroke="#3A5C89"/><circle cx="870" cy="93" r="5" fill="#60A5FA"/><circle cx="890" cy="93" r="5" fill="#94BDF4"/><circle cx="910" cy="93" r="5" fill="#D7E8FF"/><text x="872" y="141" font-size="18" fill="#60A5FA" font-weight="400">const prince = {</text><text x="886" y="177" font-size="17" fill="#F1F5FF" font-weight="400">  mindset: &quot;curious&quot;,</text><text x="886" y="209" font-size="17" fill="#F1F5FF" font-weight="400">  approach: &quot;build &amp; learn&quot;</text><text x="872" y="243" font-size="18" fill="#60A5FA" font-weight="400">};</text></g></svg>